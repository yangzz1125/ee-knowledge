<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>JavaScript 第二步：数组和对象</title>
  <script src="step-13-javascript-array-object.js" defer></script>
</head>

<body>
  <h1>电磁场与波 AI 知识图谱</h1>

  <h2>数组：保存多个知识点名称</h2>
  <ul>
    <li><span id="concept-0"></span></li>
    <li><span id="concept-1"></span></li>
    <li><span id="concept-2"></span></li>
  </ul>

  <h2>对象：保存一个知识点的详细信息</h2>
  <p>名称：<span id="node-name"></span></p>
  <p>章节：<span id="node-chapter"></span></p>
  <p>公式：<span id="node-formula"></span></p>
</body>
</html>
