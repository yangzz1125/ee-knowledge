<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>HTML 第十步：JavaScript 操作多个元素</title>
</head>

<body>
  <h1>电磁场与波 AI 知识图谱</h1>

  <h2>选择知识点</h2>

  <button
    class="knowledge-button"
    data-name="梯度"
    data-description="描述标量场变化最快方向的向量。"
    data-formula="∇φ">
    梯度
  </button>

  <button
    class="knowledge-button"
    data-name="散度"
    data-description="描述矢量场在一点处向外发散的程度。"
    data-formula="∇ · A">
    散度
  </button>

  <button
    class="knowledge-button"
    data-name="旋度"
    data-description="描述矢量场局部旋转特性的向量。"
    data-formula="∇ × A">
    旋度
  </button>

  <hr>

  <section>
    <h2 id="detail-name">知识点详情</h2>
    <p id="detail-description">请先选择一个知识点。</p>
    <p>相关公式：<span id="detail-formula">暂无</span></p>
  </section>

  <script>
    // 找到所有 class 为 knowledge-button 的按钮
    const buttons = document.querySelectorAll(".knowledge-button");
    const detailName = document.querySelector("#detail-name");
    const detailDescription = document.querySelector("#detail-description");
    const detailFormula = document.querySelector("#detail-formula");

    // 给每一个按钮绑定点击事件
    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        detailName.textContent = button.dataset.name;
        detailDescription.textContent = button.dataset.description;
        detailFormula.textContent = button.dataset.formula;
      });
    });
  </script>
</body>
</html>
