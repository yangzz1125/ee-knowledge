<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="电磁场与波课程知识图谱与 AI 学习助手">
  <title>场域 · 电磁场与波知识图谱</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 16c3.5 0 3.5-9 7-9s3.5 18 7 18 3.5-18 7-18 3.5 9 7 9"></path></svg>
        <strong>场域</strong>
        <span>电磁场与波</span>
      </div>

      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="searchInput" type="search" placeholder="搜索概念、公式或定律" autocomplete="off" aria-label="搜索知识点">
        <kbd>Ctrl K</kbd>
        <div class="search-results" id="searchResults" hidden></div>
      </form>

      <div class="topbar-actions">
        <div class="service-state" id="serviceState" role="status">
          <span class="state-dot"></span>
          <span>连接中</span>
        </div>
        <button class="icon-button" id="themeToggle" type="button" title="切换外观" aria-label="切换深浅外观">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 15.2A9 9 0 0 1 8.8 3.2a9 9 0 1 0 12 12Z"></path></svg>
        </button>
      </div>
    </header>

    <aside class="rail" aria-label="课程导航">
      <nav class="chapter-list" id="chapterList" aria-label="课程章节"></nav>

      <div class="type-block">
        <p class="rail-label">知识类型</p>
        <div class="type-list" id="typeList"></div>
      </div>

      <footer class="rail-footer">
        <span id="knowledgeCount">正在载入知识库</span>
        <button class="quiet-button" id="resetView" type="button">显示全部</button>
      </footer>
    </aside>

    <main class="stage" aria-labelledby="graphTitle">
      <div class="col-resizer left" id="railResizer" role="separator" aria-orientation="vertical" aria-label="调整左栏宽度" tabindex="0" title="拖动调整宽度，双击恢复默认"></div>
      <div class="col-resizer right" id="panelResizer" role="separator" aria-orientation="vertical" aria-label="调整右栏宽度" tabindex="0" title="拖动调整宽度，双击恢复默认"></div>
      <div class="stage-head">
        <h1 id="graphTitle">知识图谱</h1>
        <p><span id="graphContext">完整课程</span> · <span id="graphSummary"></span></p>
        <button class="back-button" id="backToAll" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
          返回完整图谱
        </button>
      </div>
      <div class="canvas" id="graphScroll">
        <svg class="knowledge-graph" id="knowledgeGraph" role="img" aria-label="课程知识图谱"></svg>
        <div class="empty-state" id="graphEmpty" hidden>
          <strong>这里还没有知识点</strong>
          <span>选择其他章节或清除筛选。</span>
        </div>
      </div>
      <div class="zoom-controls" role="group" aria-label="图谱缩放">
        <button id="zoomIn" type="button" title="放大" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        <button id="zoomOut" type="button" title="缩小" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <button id="fitGraph" type="button" title="适应窗口" aria-label="适应窗口"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path></svg></button>
      </div>
      <p class="canvas-hint">滚轮缩放 · 拖动平移 · 双击空白处复位 · Esc 返回完整图谱</p>
    </main>

    <aside class="panel" aria-label="详情与助教">
      <div class="tabs" role="tablist">
        <button class="tab active" id="tabDetail" role="tab" aria-selected="true" aria-controls="detailPane" type="button">知识点</button>
        <button class="tab" id="tabPath" role="tab" aria-selected="false" aria-controls="pathPane" type="button">学习路径</button>
        <button class="tab" id="tabChat" role="tab" aria-selected="false" aria-controls="chatPane" type="button">课程助教</button>
      </div>

      <section class="pane" id="detailPane" role="tabpanel" aria-labelledby="tabDetail">
        <div class="inspector-empty" id="inspectorEmpty">
          <strong>选择一个知识点</strong>
          <p>点击图中的节点，查看定义、公式、适用条件，以及它与其他知识的联系。</p>
        </div>

        <article class="entity-detail" id="entityDetail" hidden>
          <header>
            <span class="entity-kind" id="entityType"></span>
            <h2 id="entityName"></h2>
            <p id="entitySummary"></p>
          </header>

          <section class="detail-section" id="formulaSection" hidden>
            <h3>表达式</h3>
            <div class="formula-display" id="entityFormula"></div>
          </section>

          <section class="detail-section" id="variablesSection" hidden>
            <h3>变量</h3>
            <table class="variable-table">
              <thead><tr><th>符号</th><th>含义</th><th>单位</th></tr></thead>
              <tbody id="entityVariables"></tbody>
            </table>
          </section>

          <section class="detail-section" id="definitionSection" hidden>
            <h3>定义</h3>
            <p id="entityDefinition"></p>
          </section>

          <section class="detail-section" id="conditionsSection" hidden>
            <h3>适用条件</h3>
            <ul class="plain-list" id="entityConditions"></ul>
          </section>

          <section class="detail-section" id="neighborSections">
            <span class="muted">正在载入</span>
          </section>

          <div class="detail-actions">
            <button class="primary-button" id="askAboutEntity" type="button">向助教提问</button>
            <button class="quiet-button" id="setPathStart" type="button">设为路径起点</button>
            <button class="quiet-button" id="setPathEnd" type="button">设为路径终点</button>
          </div>
        </article>
      </section>

      <section class="pane" id="pathPane" role="tabpanel" aria-labelledby="tabPath" hidden>
        <form class="path-form" id="pathForm" autocomplete="off">
          <p class="path-intro">选择两个知识点，查看从一个学到另一个要经过哪些知识。</p>
          <div class="picker">
            <label for="pathStart">起点</label>
            <input id="pathStart" type="text" placeholder="输入知识点名称">
            <div class="picker-results" hidden></div>
          </div>
          <button class="swap-button" id="swapPath" type="button" title="交换起点和终点" aria-label="交换起点和终点">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>
          </button>
          <div class="picker">
            <label for="pathEnd">终点</label>
            <input id="pathEnd" type="text" placeholder="输入知识点名称">
            <div class="picker-results" hidden></div>
          </div>
          <label class="check">
            <input id="pathUndirected" type="checkbox">
            忽略关系方向（只看有没有联系）
          </label>
          <button class="primary-button" type="submit">查找路径</button>
        </form>
        <div class="path-result" id="pathResult" aria-live="polite"></div>
      </section>

      <section class="pane chat-pane" id="chatPane" role="tabpanel" aria-labelledby="tabChat" hidden>
        <div class="chat-head">
          <p id="assistantContext">回答只依据当前知识图谱</p>
          <button class="quiet-button" id="clearConversation" type="button">清空对话</button>
        </div>
        <div class="conversation" id="conversation" aria-live="polite">
          <div class="welcome-message">
            <strong>从一个问题开始</strong>
            <p>试试“高斯定律为什么需要闭合曲面？”</p>
          </div>
        </div>
        <form class="composer" id="chatForm">
          <textarea id="chatInput" rows="1" maxlength="500" placeholder="询问这个知识图谱中的内容" aria-label="向课程助教提问"></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="发送问题">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-8-5 16-3-6-6-2Z"></path><path d="m11 14 8-10"></path></svg>
          </button>
        </form>
      </section>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
