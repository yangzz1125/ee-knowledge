server {
    listen 80;
    server_name 154.201.94.196;

    access_log /www/wwwlogs/ee-knowledge.access.log;
    error_log /www/wwwlogs/ee-knowledge.error.log;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name ee.yang2026.eu.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/ee-knowledge/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ee.yang2026.eu.cc$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ee.yang2026.eu.cc;

    ssl_certificate /www/server/panel/vhost/cert/ee.yang2026.eu.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ee.yang2026.eu.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EE_KNOWLEDGE_TLS:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/ee-knowledge.access.log;
    error_log /www/wwwlogs/ee-knowledge.error.log;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
